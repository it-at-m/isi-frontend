name: build and test

on: [push]

jobs:
  build-test-npm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Execute npm install, test, build
        working-directory: .
        run: |
          npm ci
          npm run build --if-present
          npm run test:unit
      - name: Check with eslint
        run: |
          npm install
          npm run check
      - name: Archive npm artifacts
        uses: actions/upload-artifact@v7
        with:
          name: npm-artifacts
          path: |
            dist
          retention-days: 10
